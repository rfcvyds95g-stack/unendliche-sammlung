<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Unendliche Sammlung</title>
<style>
:root { --bg:#0d0d1a; --card:#16162a; --accent:#7c5cff; --text:#e8e8ff; --muted:#8888aa; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:background .6s; }
.nav { background:#12122a; border-bottom:1px solid #2a2a44; padding:12px 20px; display:flex; gap:8px; overflow-x:auto; position:sticky; top:0; z-index:100; }
.nav button { background:transparent; border:none; color:var(--muted); padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600; white-space:nowrap; transition:.2s; }
.nav button.active { background:var(--accent); color:#fff; }
.nav button:hover { color:#fff; background:#2a2a44; }
.page { display:none; padding:20px; max-width:1200px; margin:0 auto; }
.page.active { display:block; }
header { text-align:center; margin-bottom:24px; }
h1 { font-size:2.4rem; background:linear-gradient(90deg,#7c5cff,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { color:var(--muted); margin-top:6px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:20px 0; }
.stat-card { background:var(--card); padding:16px; border-radius:14px; text-align:center; border:1px solid #2a2a44; }
.stat-card h3 { font-size:.8rem; color:var(--muted); margin-bottom:6px; }
.stat-card .value { font-size:1.5rem; font-weight:700; color:var(--accent); }
.controls { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:24px 0; }
button.action { padding:14px 28px; font-size:1.1rem; border:none; border-radius:12px; cursor:pointer; font-weight:600; transition:.2s; }
.search-btn { background:linear-gradient(135deg,#7c5cff,#a78bfa); color:#fff; box-shadow:0 4px 20px rgba(124,92,255,.3); }
.search-btn:hover { transform:translateY(-2px); }
.auto-btn { background:#2a2a44; color:var(--text); border:1px solid #444; }
.auto-btn.active { background:#10b981; color:#fff; }
.recent { margin-top:30px; }
.find-card { background:var(--card); border-radius:12px; padding:14px 18px; margin:10px 0; display:flex; justify-content:space-between; align-items:center; border-left:5px solid; animation:slideIn .4s; }
@keyframes slideIn { from { opacity:0; transform:translateY(-15px); } to { opacity:1; transform:translateY(0); } }
.rarity-badge { padding:4px 12px; border-radius:20px; font-size:.8rem; font-weight:700; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.card { background:var(--card); border-radius:12px; padding:14px; border:1px solid #2a2a44; }
.skill-node { background:#1e1e32; border:2px solid #333; border-radius:10px; padding:12px; margin:8px 0; cursor:pointer; transition:.15s; }
.skill-node.unlocked { border-color:#10b981; background:#1a3a2a; }
.skill-node.available { border-color:#f59e0b; }
.skill-node.locked { opacity:.55; cursor:not-allowed; }
.notification { position:fixed; top:70px; right:20px; background:#10b981; color:#fff; padding:12px 20px; border-radius:10px; transform:translateX(400px); transition:.4s; z-index:200; font-weight:600; }
.notification.show { transform:translateX(0); }
.progress-bar { height:8px; background:#2a2a44; border-radius:4px; margin-top:6px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); transition:width .3s; }
.search-box { width:100%; padding:10px 14px; border-radius:10px; border:1px solid #333; background:#1a1a2e; color:var(--text); margin-bottom:12px; }
.filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.filter-btn { padding:6px 14px; border-radius:20px; background:#2a2a44; border:1px solid #444; color:var(--text); cursor:pointer; font-size:.85rem; }
.filter-btn.active { background:var(--accent); }
.event-banner { background:linear-gradient(90deg,#7c5cff,#a78bfa); color:#fff; padding:10px 16px; border-radius:10px; margin:12px 0; text-align:center; font-weight:600; display:none; }
.event-banner.active { display:block; }
</style>
</head>
<body>
<nav class="nav">
  <button class="nav-btn active" data-page="home">🏠 Suche</button>
  <button class="nav-btn" data-page="inventory">📦 Inventar</button>
  <button class="nav-btn" data-page="skills">🌳 Skilltree</button>
  <button class="nav-btn" data-page="achievements">🏆 Achievements</button>
  <button class="nav-btn" data-page="events">🌍 Events</button>
  <button class="nav-btn" data-page="stats">📊 Stats</button>
</nav>

<div class="page active" id="page-home">
  <header>
    <h1>Die Unendliche Sammlung</h1>
    <p class="subtitle">Sammle gewöhnliche bis jenseits-seltene Artefakte</p>
    <div style="margin-top:10px;color:var(--muted);font-size:.9rem;">Level <span id="player-level">1</span> • Glück: <span id="luck-mult">1.00</span>x • Event: <span id="current-event">Keins</span> • SP: <span id="skill-points">0</span></div>
  </header>
  <div id="event-banner" class="event-banner"></div>
  <div class="stats">
    <div class="stat-card"><h3>Suchen</h3><div class="value" id="total-searches">0</div></div>
    <div class="stat-card"><h3>Items</h3><div class="value" id="total-items">0</div></div>
    <div class="stat-card"><h3>Einzigartig</h3><div class="value" id="unique-items">0</div></div>
    <div class="stat-card"><h3>Seltenstes</h3><div class="value" id="rarest-item" style="font-size:1.1rem;">-</div></div>
    <div class="stat-card"><h3>XP</h3><div class="value" id="xp-display">0</div><div class="progress-bar"><div class="progress-fill" id="xp-bar" style="width:0%"></div></div></div>
  </div>
  <div class="controls">
    <button class="action search-btn" id="search-btn">🔍 Suchen (x<span id="search-power">1</span>)</button>
    <button class="action auto-btn" id="auto-btn">Auto-Suche: AUS</button>
    <button class="action" style="background:transparent;color:#ef4444;border:1px solid #ef4444;" id="reset-btn">Reset</button>
  </div>
  <div class="recent">
    <h2 style="margin-bottom:12px;color:var(--muted);">Letzte Funde</h2>
    <div id="recent-list"></div>
  </div>
</div>

<div class="page" id="page-inventory">
  <h2 style="margin-bottom:16px;">📦 Inventar</h2>
  <input class="search-box" id="inv-search" placeholder="Item suchen...">
  <div class="filter-bar" id="filter-bar"></div>
  <div class="grid" id="inventory-grid"></div>
</div>

<div class="page" id="page-skills">
  <h2 style="margin-bottom:16px;">🌳 Skilltree</h2>
  <div id="skill-tree" style="display:flex;flex-wrap:wrap;gap:20px;justify-content:center;"></div>
</div>

<div class="page" id="page-achievements">
  <h2 style="margin-bottom:16px;">🏆 Achievements</h2>
  <div id="ach-list" class="grid"></div>
</div>

<div class="page" id="page-events">
  <h2 style="margin-bottom:16px;">🌍 Events</h2>
  <div id="event-status" class="card" style="margin-bottom:16px;text-align:center;"></div>
  <div id="bio-list" class="grid"></div>
</div>

<div class="page" id="page-stats">
  <h2 style="margin-bottom:16px;">📊 Statistiken</h2>
  <div style="margin-top:20px;">
    <button class="action" style="background:#2a2a44;" onclick="exportSave()">Export Speichern</button>
    <textarea id="export-box" readonly style="width:100%;height:100px;margin-top:10px;background:#1a1a2e;color:#ccc;border:1px solid #333;border-radius:8px;padding:10px;"></textarea>
  </div>
</div>

<div class="notification" id="notification"></div>

<script>
const rarities = [
  {name:'Gewöhnlich',chance:0.40,color:'#aaa',weight:1},
  {name:'Ungewöhnlich',chance:0.25,color:'#5f5',weight:2},
  {name:'Selten',chance:0.15,color:'#55f',weight:3},
  {name:'Episch',chance:0.09,color:'#a5f',weight:4},
  {name:'Legendär',chance:0.04,color:'#fa0',weight:5},
  {name:'Mythisch',chance:0.018,color:'#f55',weight:6},
  {name:'Göttlich',chance:0.007,color:'#ff5',weight:7},
  {name:'Kosmisch',chance:0.0025,color:'#5ff',weight:8},
  {name:'Transzendent',chance:0.0009,color:'#f5f',weight:9},
  {name:'Absolut',chance:0.0003,color:'#fff',weight:10},
  {name:'Primordial',chance:0.00008,color:'#f0f',weight:11},
  {name:'Unendlich',chance:0.000015,color:'#0ff',weight:12},
  {name:'Jenseits',chance:0.000003,color:'#fd0',weight:13}
];

const biomes = [
  {id:'wald',name:'🌲 Wald',rareBonus:1.0,desc:'Ruhiger Wald – Standard-Chancen', theme:'#0d1a0d'},
  {id:'hoehle',name:'🕳️ Höhle',rareBonus:1.25,desc:'Dunkle Höhle – mehr Seltenheiten', theme:'#1a1a0d'},
  {id:'ruinen',name:'🏛️ Ruinen',rareBonus:1.45,desc:'Alte Ruinen – Relikte häufiger', theme:'#1a1210'},
  {id:'berg',name:'⛰️ Berggipfel',rareBonus:1.7,desc:'Hohe Gipfel – starke Rare-Boni', theme:'#0d121a'},
  {id:'void',name:'🌀 Void',rareBonus:2.1,desc:'Void-Riss – extrem seltene Funde', theme:'#120d1a'},
  {id:'kosmos',name:'🌌 Kosmos',rareBonus:2.5,desc:'Kosmischer Nexus – maximale Chancen', theme:'#0a0a1a'}
];

const categories = ['Artefakt','Material','Kreatur','Relikt','Waffe','Rüstung','Essenz','Fragment'];

const skills = [
  {id:'s1',branch:'Suche',name:'Schneller Start',desc:'+1 Suchkraft',cost:1,req:[],effect:{power:1}},
  {id:'s2',branch:'Suche',name:'Doppelte Suche',desc:'+1 Suchkraft',cost:2,req:['s1'],effect:{power:1}},
  {id:'s3',branch:'Suche',name:'Dreifach',desc:'+1 Suchkraft',cost:3,req:['s2'],effect:{power:1}},
  {id:'s4',branch:'Suche',name:'Vierfach',desc:'+1 Suchkraft',cost:4,req:['s3'],effect:{power:1}},
  {id:'s5',branch:'Suche',name:'Fünffach',desc:'+1 Suchkraft',cost:5,req:['s4'],effect:{power:1}},
  {id:'s6',branch:'Suche',name:'Turbo',desc:'+2 Suchkraft',cost:8,req:['s5'],effect:{power:2}},
  {id:'s7',branch:'Suche',name:'Hyper',desc:'+2 Suchkraft',cost:12,req:['s6'],effect:{power:2}},
  {id:'s8',branch:'Suche',name:'Ultra',desc:'+3 Suchkraft',cost:18,req:['s7'],effect:{power:3}},
  {id:'l1',branch:'Glück',name:'Kleines Glück',desc:'+5% Luck',cost:1,req:[],effect:{luck:0.05}},
  {id:'l2',branch:'Glück',name:'Mittleres Glück',desc:'+5% Luck',cost:2,req:['l1'],effect:{luck:0.05}},
  {id:'l3',branch:'Glück',name:'Großes Glück',desc:'+8% Luck',cost:3,req:['l2'],effect:{luck:0.08}},
  {id:'l4',branch:'Glück',name:'Episches Glück',desc:'+8% Luck',cost:4,req:['l3'],effect:{luck:0.08}},
  {id:'l5',branch:'Glück',name:'Legendäres Glück',desc:'+10% Luck',cost:6,req:['l4'],effect:{luck:0.10}},
  {id:'l6',branch:'Glück',name:'Mythisches Glück',desc:'+12% Luck',cost:8,req:['l5'],effect:{luck:0.12}},
  {id:'l7',branch:'Glück',name:'Göttliches Glück',desc:'+15% Luck',cost:12,req:['l6'],effect:{luck:0.15}},
  {id:'l8',branch:'Glück',name:'Kosmisch',desc:'+20% Luck',cost:16,req:['l7'],effect:{luck:0.20}},
  {id:'x1',branch:'XP',name:'Lernbereit',desc:'+10% XP',cost:1,req:[],effect:{xp:0.10}},
  {id:'x2',branch:'XP',name:'Schnelllerner',desc:'+10% XP',cost:2,req:['x1'],effect:{xp:0.10}},
  {id:'x3',branch:'XP',name:'Genie',desc:'+15% XP',cost:3,req:['x2'],effect:{xp:0.15}},
  {id:'x4',branch:'XP',name:'Meister',desc:'+15% XP',cost:5,req:['x3'],effect:{xp:0.15}},
  {id:'x5',branch:'XP',name:'Weiser',desc:'+20% XP',cost:8,req:['x4'],effect:{xp:0.20}},
  {id:'o1',branch:'Offline',name:'Kurzer Schlaf',desc:'Offline effizienter',cost:2,req:[],effect:{offline:0.2}},
  {id:'o2',branch:'Offline',name:'Tiefer Schlaf',desc:'+Offline',cost:3,req:['o1'],effect:{offline:0.3}},
  {id:'o3',branch:'Offline',name:'Traumwandler',desc:'+Offline',cost:5,req:['o2'],effect:{offline:0.4}},
  {id:'o4',branch:'Offline',name:'Ewiger Traum',desc:'Max Offline',cost:8,req:['o3'],effect:{offline:0.5}},
  {id:'c1',branch:'Sammlung',name:'Sammler',desc:'+5% Unique',cost:2,req:[],effect:{unique:0.05}},
  {id:'c2',branch:'Sammlung',name:'Archivar',desc:'+5% Unique',cost:3,req:['c1'],effect:{unique:0.05}},
  {id:'c3',branch:'Sammlung',name:'Kurator',desc:'+8% Unique',cost:5,req:['c2'],effect:{unique:0.08}},
  {id:'c4',branch:'Sammlung',name:'Meister-Sammler',desc:'+10% Unique',cost:8,req:['c3'],effect:{unique:0.10}},
  {id:'b1',branch:'Biome',name:'Entdecker',desc:'Biome Bonus +5%',cost:2,req:[],effect:{biome:0.05}},
  {id:'b2',branch:'Biome',name:'Wanderer',desc:'+5% Biome',cost:3,req:['b1'],effect:{biome:0.05}},
  {id:'b3',branch:'Biome',name:'Abenteurer',desc:'+8% Biome',cost:5,req:['b2'],effect:{biome:0.08}},
  {id:'b4',branch:'Biome',name:'Weltenwanderer',desc:'+10% Biome',cost:8,req:['b3'],effect:{biome:0.10}},
  {id:'h1',branch:'Hybrid',name:'Synergie',desc:'+5% alles',cost:6,req:['s3','l3'],effect:{power:1,luck:0.05}},
  {id:'h2',branch:'Hybrid',name:'Perfekte Balance',desc:'+10% alles',cost:12,req:['h1','x3'],effect:{power:1,luck:0.10,xp:0.10}},
  {id:'h3',branch:'Hybrid',name:'Transzendenz',desc:'Massiver Boost',cost:20,req:['h2','l6','s6'],effect:{power:2,luck:0.15,xp:0.15,offline:0.3}}
];

const achievements = [
  {id:'first',name:'Erster Fund',desc:'1 Suche',check:s=>s.searches>=1},
  {id:'hundred',name:'100 Suchen',desc:'100 Suchen',check:s=>s.searches>=100},
  {id:'thousand',name:'1000 Suchen',desc:'1000 Suchen',check:s=>s.searches>=1000},
  {id:'rare',name:'Selten',desc:'Seltenes Item',check:s=>hasRarity(s,3)},
  {id:'epic',name:'Episch',desc:'Episches Item',check:s=>hasRarity(s,4)},
  {id:'legend',name:'Legendär',desc:'Legendäres',check:s=>hasRarity(s,5)},
  {id:'unique50',name:'50 Unique',desc:'50 verschiedene',check:s=>s.uniqueMap.size>=50},
  {id:'level10',name:'Level 10',desc:'Level 10',check:s=>s.level>=10},
  {id:'skills10',name:'10 Skills',desc:'10 Skills freigeschaltet',check:s=>s.unlockedSkills.length>=10}
];

let state = {
  searches:0, items:[], uniqueMap:new Map(), autoInterval:null, autoOn:false,
  level:1, xp:0, searchPower:1, currentBiome:'wald',
  unlockedAchievements:[], lastOnline:Date.now(), dailyClaimed:null,
  skillPoints:0, unlockedSkills:[],
  activeEvent: null
};

function hasRarity(s,w){ for(const d of s.uniqueMap.values()) if(d.weight>=w) return true; return false; }
function getSkillEffects(){
  let e = {power:0, luck:0, xp:0, offline:0, unique:0, biome:0};
  state.unlockedSkills.forEach(id=>{
    const sk = skills.find(s=>s.id===id);
    if(sk && sk.effect) Object.keys(sk.effect).forEach(k=> e[k]=(e[k]||0)+sk.effect[k]);
  });
  return e;
}

function loadState(){
  const saved = localStorage.getItem('infiniteCollection');
  if(saved){
    const d = JSON.parse(saved);
    Object.assign(state,d);
    state.uniqueMap = new Map(d.unique||[]);
    state.unlockedAchievements = d.unlockedAchievements||[];
    state.unlockedSkills = d.unlockedSkills||[];
    if(d.activeEvent && d.activeEvent.endsAt > Date.now()) state.activeEvent = d.activeEvent;
    else state.activeEvent = null;
  }
  processOffline();
  checkDaily();
  updateUI();
  checkAchievements();
  applyEventTheme();
}

function saveState(){
  const data = {...state, items:state.items.slice(-300), unique:Array.from(state.uniqueMap.entries()), lastOnline:Date.now()};
  delete data.autoInterval;
  localStorage.setItem('infiniteCollection', JSON.stringify(data));
}

function processOffline(){
  const now=Date.now();
  const elapsed = Math.min(now-(state.lastOnline||now), 16*3600*1000);
  if(elapsed>60000 && state.searches>5){
    const eff = getSkillEffects();
    const mult = 1 + (eff.offline||0);
    const off = Math.floor(elapsed/1800 * state.searchPower * mult);
    if(off>0){
      showNotification(`Offline: +${Math.min(off,800)} Suchen`);
      for(let i=0;i<Math.min(off,800);i++) doSearch(false);
    }
  }
  state.lastOnline=now;
}

function checkDaily(){
  const today=new Date().toDateString();
  if(state.dailyClaimed!==today){
    state.xp += 40*state.level;
    state.skillPoints += 1;
    showNotification('Tägliche Belohnung: XP + 1 Skillpunkt!');
    state.dailyClaimed=today;
  }
}

function getActiveBiome(){
  if(state.activeEvent && state.activeEvent.endsAt > Date.now()){
    return biomes.find(b=>b.id===state.activeEvent.biomeId) || biomes[0];
  }
  return biomes[0];
}

function getLuck(){
  const biome = getActiveBiome();
  const eff = getSkillEffects();
  return (1+(state.level-1)*0.025) * biome.rareBonus * (1+(eff.luck||0)) * (1+(eff.biome||0));
}

function rollRarity(){
  const luck=getLuck();
  const roll=Math.random();
  let cum=0;
  for(const r of rarities){
    let ch=r.chance;
    if(r.weight>=4) ch*=luck;
    cum+=ch;
    if(roll<cum) return r;
  }
  return rarities[0];
}

function generateName(r){
  const cat=categories[Math.floor(Math.random()*categories.length)];
  const prefs = r.weight<=3?['Gewöhnlich','Einfach','Schlicht']:r.weight<=6?['Glänzend','Verzaubert','Selten']:r.weight<=9?['Antiker','Mythischer','Kosmisch']:['Der Letzte','Jenseits','Absolut'];
  const bases=['Stein','Kristall','Relikt','Fragment','Essenz','Kern','Herz','Feder','Zahn','Amulett'];
  const name = `${prefs[Math.floor(Math.random()*prefs.length)]} ${bases[Math.floor(Math.random()*bases.length)]}`;
  return {name, category:cat};
}

function tryTriggerEvent(){
  if(state.activeEvent && state.activeEvent.endsAt > Date.now()) return;
  if(Math.random() < 0.008){
    const possible = biomes.filter(b=>b.id!=='wald');
    const chosen = possible[Math.floor(Math.random()*possible.length)];
    const duration = (5 + Math.random()*10) * 60 * 1000;
    state.activeEvent = {biomeId: chosen.id, endsAt: Date.now() + duration};
    showNotification(`🌟 Event gestartet: ${chosen.name}!`);
    applyEventTheme();
  }
}

function applyEventTheme(){
  const biome = getActiveBiome();
  document.body.style.background = biome.theme || '#0d0d1a';
  const banner = document.getElementById('event-banner');
  if(state.activeEvent && state.activeEvent.endsAt > Date.now()){
    const remaining = Math.max(0, Math.floor((state.activeEvent.endsAt - Date.now())/1000));
    const min = Math.floor(remaining/60);
    const sec = remaining%60;
    banner.textContent = `${biome.name} aktiv! Noch ${min}:${sec.toString().padStart(2,'0')} min`;
    banner.classList.add('active');
    document.getElementById('current-event').textContent = biome.name;
  } else {
    banner.classList.remove('active');
    document.getElementById('current-event').textContent = 'Keins';
    document.body.style.background = '#0d0d1a';
    state.activeEvent = null;
  }
}

function doSearch(notify=true){
  tryTriggerEvent();
  const times = state.searchPower + (getSkillEffects().power||0);
  const xpMult = 1 + (getSkillEffects().xp||0);
  for(let t=0;t<times;t++){
    state.searches++;
    state.xp += (1+Math.floor(state.level/2)) * xpMult;
    const rarity = rollRarity();
    const gen = generateName(rarity);
    const item = {name:gen.name, category:gen.category, rarity:rarity.name, color:rarity.color, weight:rarity.weight, timestamp:Date.now(), id:Math.random()};
    state.items.unshift(item);
    if(state.items.length>120) state.items.pop();
    const key=item.name.toLowerCase();
    if(state.uniqueMap.has(key)) state.uniqueMap.get(key).count++;
    else state.uniqueMap.set(key,{count:1,rarity:rarity.name,color:rarity.color,weight:rarity.weight,name:item.name,category:gen.category});
    if(notify && t===0) addRecentFind(item);
    if(rarity.weight>=6 && notify) showNotification(`🌟 ${rarity.name}: ${item.name}`);
  }
  levelUpCheck();
  checkAchievements();
  updateUI();
  saveState();
  applyEventTheme();
}

function levelUpCheck(){
  const needed = state.level*80 + Math.pow(state.level,1.4)*15;
  while(state.xp >= needed){
    state.xp -= needed;
    state.level++;
    state.skillPoints++;
    showNotification(`Level ${state.level}! +1 Skillpunkt`);
  }
}

function checkAchievements(){
  achievements.forEach(a=>{
    if(!state.unlockedAchievements.includes(a.id) && a.check(state)){
      state.unlockedAchievements.push(a.id);
      showNotification(`🏆 ${a.name}`);
    }
  });
}

function addRecentFind(item){
  const list=document.getElementById('recent-list');
  const card=document.createElement('div');
  card.className='find-card';
  card.style.borderLeftColor=item.color;
  card.innerHTML=`<div><div style="font-weight:600;color:${item.color}">${item.name}</div><div style="font-size:.8rem;color:var(--muted)">${item.category}</div></div><span class="rarity-badge" style="background:${item.color}22;color:${item.color};border:1px solid ${item.color}">${item.rarity}</span>`;
  list.prepend(card);
  while(list.children.length>5) list.removeChild(list.lastChild);
}

function updateUI(){
  document.getElementById('total-searches').textContent=state.searches.toLocaleString('de-DE');
  let tf=0, rw=0, rn='-', rc='#fff';
  for(const d of state.uniqueMap.values()){ tf+=d.count; if(d.weight>rw){rw=d.weight;rn=d.rarity;rc=d.color;} }
  document.getElementById('total-items').textContent=tf.toLocaleString('de-DE');
  document.getElementById('unique-items').textContent=state.uniqueMap.size.toLocaleString('de-DE');
  document.getElementById('rarest-item').textContent=rn;
  document.getElementById('rarest-item').style.color=rc;
  document.getElementById('player-level').textContent=state.level;
  document.getElementById('luck-mult').textContent=getLuck().toFixed(2);
  document.getElementById('search-power').textContent=state.searchPower + (getSkillEffects().power||0);
  document.getElementById('skill-points').textContent=state.skillPoints;
  const needed=state.level*80 + Math.pow(state.level,1.4)*15;
  document.getElementById('xp-display').textContent=Math.floor(state.xp);
  document.getElementById('xp-bar').style.width=Math.min(100,(state.xp/needed)*100)+'%';
}

function showNotification(t){
  const n=document.getElementById('notification');
  n.textContent=t; n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'),3200);
}

function toggleAuto(){
  state.autoOn=!state.autoOn;
  const btn=document.getElementById('auto-btn');
  if(state.autoOn){ btn.textContent='Auto-Suche: AN'; btn.classList.add('active'); state.autoInterval=setInterval(()=>doSearch(true),380); }
  else { btn.textContent='Auto-Suche: AUS'; btn.classList.remove('active'); clearInterval(state.autoInterval); }
}

function renderSkills(){
  const tree=document.getElementById('skill-tree');
  tree.innerHTML='';
  const branches=[...new Set(skills.map(s=>s.branch))];
  branches.forEach(br=>{
    const div=document.createElement('div');
    div.style.cssText='background:#1a1a2e;border-radius:14px;padding:16px;min-width:220px;border:1px solid #2a2a44;';
    div.innerHTML=`<h3 style="text-align:center;margin-bottom:12px;color:#a78bfa;">${br}</h3>`;
    skills.filter(s=>s.branch===br).forEach(sk=>{
      const unlocked=state.unlockedSkills.includes(sk.id);
      const canBuy=!unlocked && state.skillPoints>=sk.cost && sk.req.every(r=>state.unlockedSkills.includes(r));
      const node=document.createElement('div');
      node.className='skill-node '+(unlocked?'unlocked':canBuy?'available':'locked');
      node.innerHTML=`<strong>${sk.name}</strong><div style="font-size:.8rem;color:var(--muted);margin:4px 0;">${sk.desc}</div><div style="font-size:.75rem;color:#aaa;">Kosten: ${sk.cost} SP ${unlocked?'✅':''}</div>`;
      if(canBuy) node.onclick=()=>{
        state.skillPoints-=sk.cost;
        state.unlockedSkills.push(sk.id);
        showNotification(`Skill freigeschaltet: ${sk.name}`);
        updateUI(); saveState(); renderSkills();
      };
      div.appendChild(node);
    });
    tree.appendChild(div);
  });
}

function renderInventory(filter='all', search=''){
  const grid=document.getElementById('inventory-grid');
  grid.innerHTML='';
  const items=Array.from(state.uniqueMap.values())
    .filter(i=>(filter==='all'||i.rarity===filter) && i.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>b.weight-a.weight||b.count-a.count);
  if(!items.length){ grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;">Keine Items gefunden.</p>'; return; }
  items.forEach(it=>{
    const el=document.createElement('div');
    el.className='card';
    el.style.borderLeft=`4px solid ${it.color}`;
    el.innerHTML=`<div style="font-weight:600;color:${it.color}">${it.name}</div><div style="font-size:.8rem;color:var(--muted);margin-top:4px;">${it.category||''} • ${it.rarity} • ${it.count}x</div>`;
    grid.appendChild(el);
  });
}

function renderFilters(){
  const bar=document.getElementById('filter-bar');
  bar.innerHTML='<button class="filter-btn active" data-f="all">Alle</button>';
  rarities.forEach(r=>{
    const b=document.createElement('button');
    b.className='filter-btn';
    b.dataset.f=r.name;
    b.textContent=r.name;
    b.onclick=()=>{renderInventory(r.name,document.getElementById('inv-search').value); document.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x.dataset.f===r.name));};
    bar.appendChild(b);
  });
  bar.querySelector('[data-f="all"]').onclick=()=>{renderInventory('all',document.getElementById('inv-search').value); document.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x.dataset.f==='all'));};
}

function renderAchievements(){
  const list=document.getElementById('ach-list');
  list.innerHTML='';
  achievements.forEach(a=>{
    const un=state.unlockedAchievements.includes(a.id);
    const el=document.createElement('div');
    el.className='card';
    el.style.opacity=un?1:0.55;
    el.innerHTML=`<strong>${un?'✅':'🔒'} ${a.name}</strong><div style="font-size:.85rem;color:var(--muted);margin-top:6px;">${a.desc}</div>`;
    list.appendChild(el);
  });
}

function renderEvents(){
  const status=document.getElementById('event-status');
  const list=document.getElementById('bio-list');
  list.innerHTML='';
  if(state.activeEvent && state.activeEvent.endsAt > Date.now()){
    const b = biomes.find(x=>x.id===state.activeEvent.biomeId);
    const rem = Math.max(0, Math.floor((state.activeEvent.endsAt - Date.now())/1000));
    status.innerHTML = `<strong>Aktives Event: ${b.name}</strong><div style="margin-top:6px;">Noch ${Math.floor(rem/60)}:${(rem%60).toString().padStart(2,'0')} min • Bonus x${b.rareBonus}</div>`;
  } else {
    status.innerHTML = '<strong>Kein Event aktiv</strong><div style="margin-top:6px;color:var(--muted);">Events starten zufällig beim Suchen (ca. 0,8% Chance)</div>';
  }
  biomes.forEach(b=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<strong>${b.name}</strong><div style="font-size:.85rem;color:var(--muted);margin-top:6px;">${b.desc}<br>Bonus: x${b.rareBonus}</div>`;
    list.appendChild(el);
  });
}

function exportSave(){
  document.getElementById('export-box').value = btoa(JSON.stringify(localStorage.getItem('infiniteCollection')));
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-'+btn.dataset.page).classList.add('active');
    if(btn.dataset.page==='inventory'){ renderFilters(); renderInventory(); }
    if(btn.dataset.page==='skills') renderSkills();
    if(btn.dataset.page==='achievements') renderAchievements();
    if(btn.dataset.page==='events') renderEvents();
  };
});

document.getElementById('search-btn').onclick=()=>doSearch(true);
document.getElementById('auto-btn').onclick=toggleAuto;
document.getElementById('inv-search').oninput=e=>renderInventory(document.querySelector('.filter-btn.active')?.dataset.f||'all',e.target.value);
document.getElementById('reset-btn').onclick=()=>{if(confirm('Alles zurücksetzen?')){localStorage.removeItem('infiniteCollection');location.reload();}};
document.addEventListener('keydown',e=>{if(e.code==='Space' && !e.repeat && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();doSearch(true);}});

setInterval(applyEventTheme, 1000);

loadState();
console.log('Event-basierte Biome geladen!');
</script>
</body>
</html>
